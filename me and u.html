
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
  font-family: Georgia, serif;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 30px 20px;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 25px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.heart {
  font-size: 65px;
  animation: beat 1.2s infinite;
}

h1 {
  font-size: 32px;
}

.poem {
  font-size: 19px;
  line-height: 1.8;
  margin: 20px 0;
}

.note {
  font-size: 15px;
  font-style: italic;
}

button {
  display: block;
  width: 85%;
  margin: 14px auto;
  padding: 14px;
  border: none;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.yes {
  background: white;
  color: #ec407a;
}

.think {
  background: #8e44ad;
  color: white;
}

#response {
  margin-top: 20px;
  font-size: 19px;
  line-height: 1.6;
}

@keyframes beat {
  50% { transform: scale(1.2); }
}

.floating {
  position: fixed;
  bottom: -30px;
  animation: float 7s linear forwards;
  pointer-events: none;
}

@keyframes float {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="heart">❤️</div>

  <h1>Will You Be Mine?</h1>

  <div class="poem">
    Roses are red,<br>
    Violets are blue,<br>
    The world is filled with many people,<br>
    But there's no one quite like you. ❤️
  </div>

  <p class="note">
    I meant it, and there's absolutely no pressure.
    Take your time. 💗
  </p>

  <button class="yes" onclick="yesAnswer()">
    YES ❤️
  </button>

  <button class="think" onclick="thinkAnswer()">
    I'll think about it 💭
  </button>

  <div id="response"></div>

</div>

<script>
function yesAnswer() {
  document.getElementById("response").innerHTML =
  "That means a lot! ❤️ Here's to seeing where this goes. 🥰";
}

function thinkAnswer() {
  document.getElementById("response").innerHTML =
  "Of course! Take all the time you need. No pressure at all. 💗";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = "20px";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 700);
</script>

</body>
</html>
