
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Be Mine ❤️</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff416c, #ff4b8b, #8e44ad);
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
}

.container {
  padding: 25px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: 48px;
  text-shadow: 0 0 15px pink;
}

.heart {
  font-size: 85px;
  animation: heartbeat 1s infinite;
}

p {
  font-size: 20px;
  line-height: 1.6;
}

button {
  padding: 15px 35px;
  margin: 10px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  cursor: pointer;
  background: white;
  color: #ff416c;
  font-weight: bold;
}

#answer {
  font-size: 23px;
  margin-top: 20px;
}

.floating {
  position: absolute;
  bottom: -50px;
  animation: float 7s linear infinite;
  font-size: 25px;
}

@keyframes heartbeat {
  50% { transform: scale(1.2); }
}

@keyframes float {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="heart">❤️</div>

  <h1>Will You Be Mine?</h1>

  <p>
    Every moment is special,<br>
    but some people make life beautiful.<br>
    You're one of them. 💕
  </p>

  <button onclick="yes()">YES ❤️</button>

  <div id="answer"></div>
</div>

<script>
function yes() {
  document.getElementById("answer").innerHTML =
    "You've just made this moment special! ❤️🥰";
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration =
    (4 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
